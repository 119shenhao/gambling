name: Gambling content sync via protected Gambling D1 executor
on:
  push:
    branches: [main]
    paths:
      - .github/gambling-content-sync-request.json
permissions:
  contents: read
concurrency:
  group: gambling-approved-production-content-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == '119shenhao/gambling' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.GAMBLING_PROD_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "289976272520a38732bef34108585e11"
      GAMBLING_SYNC_PRODUCTION_CONFIRM: "7bba9ada-589f-493b-8fcf-60265fc0efac"
    steps:
      - name: Checkout the request from the trusted executor repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse precise approved request; never accept arbitrary SQL or D1 selectors
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,os
          r=json.load(open('.github/gambling-content-sync-request.json'))
          expected={'request_id','mode','source_database_id','destination_database_id','implementation_sha','authorization'}
          if set(r)!=expected:raise SystemExit('Unexpected request keys; no D1 access')
          if not re.fullmatch(r'[A-Za-z0-9_-]{12,80}',r['request_id']):raise SystemExit('Invalid request ID')
          if r['mode'] not in ('inspect','sync'):raise SystemExit('Unrecognized mode')
          if r['source_database_id']!='a92cf620-2a0b-46e1-a0ff-2e0c94218f37' or r['destination_database_id']!='7bba9ada-589f-493b-8fcf-60265fc0efac':
              raise SystemExit('Incorrect D1 IDs')
          if r['implementation_sha']!='89a0aaf09a19220d8237b98931ddae427f8efba7':
              raise SystemExit('Unreviewed sync source code')
          if r['authorization']!='owner-approved-recurring-dev-to-prod-content-sync':
              raise SystemExit('Unauthorized request')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('mode='+r['mode']+'\n')
          print('Verified specific Gambling D1 sync request:',r['mode'],r['request_id'])
          PY
          [[ -n "$CLOUDFLARE_API_TOKEN" && "$CLOUDFLARE_ACCOUNT_ID" == "289976272520a38732bef34108585e11" ]] || { echo "::error::Protected D1 credentials not ready"; exit 1; }
      - name: Checkout pinned and tested Gambling source (never checkout unreviewed branch head)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: 119shenhao/gambling
          ref: 89a0aaf09a19220d8237b98931ddae427f8efba7
          path: forum
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forum/package-lock.json
      - name: Verify immutable source and exact Gambling D1 target IDs
        working-directory: forum
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const a=JSON.parse(readFileSync('wrangler.preview-migrations.jsonc','utf8'));
          const b=JSON.parse(readFileSync('wrangler.production-sync.jsonc','utf8'));
          if(commit!=='89a0aaf09a19220d8237b98931ddae427f8efba7'||
             a.d1_databases?.length!==1||a.d1_databases[0].binding!=='PREVIEW_DB'||
             a.d1_databases[0].database_id!=='a92cf620-2a0b-46e1-a0ff-2e0c94218f37'||
             b.d1_databases?.length!==1||b.d1_databases[0].binding!=='PRODUCTION_DB'||
             b.d1_databases[0].database_id!=='7bba9ada-589f-493b-8fcf-60265fc0efac')
             throw Error('Protected sync target or code changed; no D1 operations.');
          console.log('PASS: exact pinned reviewed code and both isolated Gambling D1 IDs.');
          NODE
      - run: npm ci --no-audit --no-fund
        working-directory: forum
      - run: npm run verify
        working-directory: forum
      - name: Require production Worker R2 and CDN purge readiness before ANY D1 apply
        if: steps.request.outputs.mode == 'sync'
        working-directory: forum
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-production-cdn-acceptance.mjs preflight
      - name: Always perform a read-only dry-run before any write
        shell: bash
        working-directory: forum
        run: |
          set -euo pipefail
          npm run sync:production -- --limit=100 > "$RUNNER_TEMP/gambling-dry-run.txt"
          python3 - <<'PY'
          import json,os,re
          data=open(os.path.join(os.environ['RUNNER_TEMP'],'gambling-dry-run.txt')).read()
          m=re.search(r'(?m)^\{\s*"mode":\s*"dry_run"',data)
          if not m:raise SystemExit('No valid machine-readable preflight; stopping')
          s=json.loads(data[m.start():])
          if not isinstance(s.get('examined'),int) or s['examined']<0 or s['examined']>100 or s.get('marked')!=0:
              raise SystemExit('Unexpected dry-run summary; stopping')
          print('Read-only sync plan:',json.dumps(s))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Gambling D1 read-only preflight\n\n'+json.dumps(s)+'\n\n')
          PY
      - name: Record an immutable production restore point before any apply
        if: steps.request.outputs.mode == 'sync'
        shell: bash
        working-directory: forum
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler d1 time-travel info gambling-community-prod --config wrangler.production-sync.jsonc --json > "$RUNNER_TEMP/gambling-prod-bookmark.json"
          python3 - <<'PY'
          import os,json
          b=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'gambling-prod-bookmark.json'))).get('bookmark')
          if not isinstance(b,str) or not b:raise SystemExit('Missing production restore bookmark: no writes')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('A production Time Travel restore bookmark was verified and retained securely before the first write.\n\n')
          print('PASS: production Time Travel recovery bookmark verified before writes; not logged')
          PY
      - name: Run existing receipt-based sync in idempotent batches
        if: steps.request.outputs.mode == 'sync'
        working-directory: forum
        shell: bash
        env:
          GAMBLING_SYNC_CDN_MANIFEST_PATH: ${{ runner.temp }}/gambling-cdn-manifest.ndjson
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          total={'new':0,'existing':0,'comments':0,'marked':0}
          for n in range(1,201):
              p=subprocess.run(['npm','run','sync:production','--','--limit=100','--apply'],
                               capture_output=True,text=True)
              if p.returncode:
                  print('Batch failed; receipt-based retries preserve already verified work. No automatic rollback.',file=sys.stderr)
                  print(p.stderr[-600:],file=sys.stderr)
                  raise SystemExit(p.returncode)
              m=re.search(r'(?m)^\{\s*"mode":\s*"apply"',p.stdout)
              if not m:raise SystemExit('Sync summary not parsable; manual investigation required')
              data=json.loads(p.stdout[m.start():])
              if data.get('examined')!=data.get('marked'):
                  raise SystemExit('Source receipt mismatch; stopping')
              if not isinstance(data['examined'],int) or data['examined']<0 or data['examined']>100:
                  raise SystemExit('Invalid per-batch count; stop')
              for key in total:total[key]+=data[key]
              print('Batch',n,json.dumps(data,ensure_ascii=False),flush=True)
              if data['examined']==0:break
          else:raise SystemExit('Max batch limit reached; investigate before retry')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Gambling content publication (source receipts validated)\n\n'+json.dumps(total)+'\n\n')
          print('PASS: content sync batches complete:',json.dumps(total))
          PY
      - name: Verify no remaining eligible unsynced source threads
        if: steps.request.outputs.mode == 'sync'
        working-directory: forum
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:production -- --limit=100 > "$RUNNER_TEMP/gambling-final-inspect.txt"
          python3 - <<'PY'
          import json,re,os
          output=open(os.path.join(os.environ['RUNNER_TEMP'],'gambling-final-inspect.txt')).read()
          m=re.search(r'(?m)^\{\s*"mode":\s*"dry_run"',output)
          if not m:raise SystemExit('Post-sync inspection missing')
          s=json.loads(output[m.start():])
          if s['examined']!=0:raise SystemExit('Still unsynced source topics; do not report full success')
          print('PASS: all eligible source threads have receipts; no subsequent incremental replies will be copied')
          PY
      - name: Require production R2/CDN purge and content-version acceptance after sync
        if: steps.request.outputs.mode == 'sync'
        working-directory: forum
        shell: bash
        env:
          GAMBLING_SYNC_CDN_MANIFEST_PATH: ${{ runner.temp }}/gambling-cdn-manifest.ndjson
        run: |
          set -euo pipefail
          node scripts/sync-production-cdn-acceptance.mjs verify
          echo '### Gambling production CDN acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo 'R2 projection and CDN content-version checks: PASS. The Gambling sync job is not successful until this step passes.' >> "$GITHUB_STEP_SUMMARY"
