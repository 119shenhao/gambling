name: Guard Cloudflare DEV Preview secrets after every build
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: gambling-dev-secret-persistence
  cancel-in-progress: true
jobs:
  secret-inheritance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_SHA: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}
      GH_API: ${{ github.api_url }}
    steps:
      - name: Wait for matching Cloudflare Preview deployment to complete
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const sha=process.env.COMMIT_SHA, repo=process.env.GH_REPO;
          const api=process.env.GH_API+'/repos/'+repo+'/commits/'+sha+'/check-runs?per_page=100';
          let ready=false;
          for(let i=1;i<=30;i++){
            const res=await fetch(api,{headers:{
              'authorization':'Bearer '+process.env.GH_TOKEN,
              'accept':'application/vnd.github+json',
              'x-github-api-version':'2022-11-28'
            },signal:AbortSignal.timeout(12000)});
            if(!res.ok)throw Error('Could not read GitHub Cloudflare check run: HTTP '+res.status);
            const data=await res.json();
            const cf=(data.check_runs||[]).filter(c=>c.name==='Workers Builds: gambling-community'&&c.app?.slug==='cloudflare-workers-and-pages');
            if(cf.some(c=>c.status==='completed'&&c.conclusion!=='success'))
              throw Error('Cloudflare DEV Preview deployment check failed; do not mark this change ready.');
            if(cf.some(c=>c.status==='completed'&&c.conclusion==='success')){
              ready=true; console.log('Cloudflare build succeeded for commit '+sha.slice(0,8));
              break;
            }
            console.log('Waiting for Cloudflare build for commit '+sha.slice(0,8)+' ('+i+'/30)');
            await new Promise(resolve=>setTimeout(resolve,10_000));
          }
          if(!ready)throw Error('Cloudflare Preview build was not confirmed for this commit; refusing to certify secret preservation.');
          NODE
      - name: Verify Cloudflare latest Preview still has protected secrets and bindings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin='https://dev-gambling-community.119shenhao.workers.dev';
          // Cloudflare may take a moment to route its new deployment.
          await new Promise(resolve=>setTimeout(resolve,10_000));
          let valid=false,last='not checked';
          for(let i=1;i<=6;i++){
            try{
              const r=await fetch(origin+'/api/health',{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(12000)});
              const j=await r.json();
              const s=j.translationSetup||{};
              const checks={
                dev:j.environment==='preview',
                workerHealthy:r.ok&&j.status==='ok',
                devD1:j.databaseConfigured===true&&j.databaseReady===true,
                azureSecretBound:s.keyConfigured===true,
                region:s.regionConfigured===true,
                azureEnabledFlag:s.workerEnabled===true,
                f0DateValid:s.freeTierVerified===true
              };
              last=JSON.stringify(checks);
              console.log('Post-deployment DEV binding status: '+last);
              if(Object.values(checks).every(Boolean)){valid=true;break;}
              // Secret lost in the latest deployment is a hard failure, not a reason to overwrite it.
            }catch(e){last='health endpoint unavailable';}
            if(i<6)await new Promise(resolve=>setTimeout(resolve,8_000));
          }
          if(!valid)throw Error('DEV binding preservation check failed: '+last+
            '. Do not publish further code until Cloudflare Preview Secret is restored. No keys were printed or modified.');
          console.log('PASS: actual deployed DEV Preview retained Azure Secret, isolated D1 and translation configuration.');
          NODE
