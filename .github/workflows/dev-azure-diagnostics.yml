name: Azure DEV one-time smoke D1 diagnostics (read-only)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/dev-azure-diagnostics.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read only one-shot DEV translation receipt and budget
        run: |
          node --input-type=module <<'NODE'
          const url='https://dev-gambling-community.119shenhao.workers.dev/api/dev/azure-smoke';
          for(let i=1;i<=18;i++){
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
              if(r.status===200){
                const j=await r.json();
                if(typeof j.receipt!=='string')throw Error('Not yet deployed');
                console.log('DEV Azure diagnostic '+JSON.stringify(j));
                console.log('PASS: safe read-only D1 receipt obtained; no Azure request made.');
                process.exit(0);
              }
              console.log('Attempt '+i+': HTTP '+r.status+' (waiting for updated DEV deployment)');
            }catch(e){console.log('Attempt '+i+': waiting for DEV deployment');}
            if(i<18)await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw Error('Safe DEV Azure diagnostic unavailable');
          NODE
