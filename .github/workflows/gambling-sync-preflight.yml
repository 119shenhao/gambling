name: Gambling independent D1 synchronization preflight
on:
  push:
    branches: [dev]
    paths: [.github/gambling-sync-preflight-request.json]
permissions:
  contents: read
concurrency:
  group: gambling-production-readonly-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == '119shenhao/gambling'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.GAMBLING_PROD_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.GAMBLING_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify repository-scoped D1 read access (no writes)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Gambling-only D1 token or account configuration not yet installed; production untouched."
            exit 1
          fi
          echo "Gambling-only D1 connection values are present (not exposed)"
      - run: npm ci --no-audit --no-fund
      - name: Verify source/tests
        run: npm run verify
      - name: Remote read-only dry-run, no --apply
        run: npm run sync:production -- --limit=20
