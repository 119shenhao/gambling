name: Gambling community checks
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install forum parser dependencies and verify offline collector contracts
        run: |
          python -m pip install 'beautifulsoup4==4.13.4'
          python -m unittest discover -s tests -p 'test_gambling_*.py' -v
      - run: npm ci
      - run: npm run verify
      - run: npm run db:local
      - run: npm run build
