name: Gambling production SSO and Worker Secret readiness (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-readiness.yml
      - wrangler.jsonc
      - src/auth.ts
      - src/index.ts
      - src/translation.ts
      - src/admin.ts
      - scripts/prepare-build.mjs
      - docs/PROJECT_STATUS.md
      - docs/CLOUDFLARE_SETUP.md
      - README.md
permissions:
  contents: write
concurrency:
  group: gambling-prod-oauth-readiness
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live production Google account chooser and D1 without credentials
        id: live
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin='https://gambling.nbn369.com';
          const issuer='https://idcenter.nbn369.com';
          const get=(url)=>fetch(url,{redirect:'manual',signal:AbortSignal.timeout(12000)});
          let passed=false;
          for(let attempt=1;attempt<=24;attempt++){
            try {
              const healthResp=await get(origin+'/api/health');
              const h=await healthResp.json();
              if(!healthResp.ok||h.environment!=='production'||h.status!=='ok'||h.databaseReady!==true)
                throw Error('production D1 or Worker not ready');
              if(h.version!=='0.5.1-language-proof-atomic.20261122')
                throw Error('production Worker has not deployed the atomic language-proof release');
              const original=await get(origin+'/api/topics/5aae46c6-56d8-468d-8d24-76bc689f09d2');
              if(!original.ok)throw Error('production original-language V2EX topic not available');
              const originalData=await original.json();
              if(originalData?.topic?.source_lang!=='zh-CN')
                throw Error('V2EX original source language not zh-CN in production');
              const meResp=await get(origin+'/api/me');
              const me=await meResp.json();
              if(!meResp.ok||me.identityConfigured!==true||me.user!==null)
                throw Error('production confidential SSO secret/config not ready');
              if(h.translationConfigured!==true)throw Error('production Azure translation is not enabled');
              const sign=await get(origin+'/api/auth/identity?return_to=%2F');
              if(sign.status!==302)throw Error('forum OAuth start not redirecting');
              const center=new URL(sign.headers.get('location')||'');
              const q=center.searchParams;
              if(center.origin!==issuer||center.pathname!=='/oauth/authorize'||
                 q.get('client_id')!=='gambling-community-prod'||
                 q.get('redirect_uri')!==origin+'/api/auth/identity/callback'||
                 q.get('code_challenge_method')!=='S256'||
                 q.get('provider_hint')!=='google'||q.get('prompt')!=='select_account'||
                 !q.get('state')||!q.get('nonce')||!q.get('code_challenge'))
                throw Error('production issuer/client/callback/PKCE/chooser mismatch');
              const handoff=await get(center);
              if(handoff.status!==302)throw Error('Identity Center did not directly hand off to Google');
              const google=new URL(handoff.headers.get('location')||'');
              if(google.origin!=='https://accounts.google.com'||
                 google.pathname!=='/o/oauth2/v2/auth'||
                 google.searchParams.get('prompt')!=='select_account'||
                 !(handoff.headers.get('set-cookie')||'').includes('__Host-ic_oauth_'))
                throw Error('Google account chooser or protected session proof unavailable');
              const legacy=await get(origin+'/api/auth/google');
              if(legacy.status!==410)throw Error('legacy Google OAuth is not disabled');
              const callback=await get(origin+'/api/auth/identity/callback');
              if(callback.status!==401)throw Error('unbound OAuth callback is not rejected');
              console.log('PASS: Gambling PROD Worker deployed 0.5.1 atomic language-proof release; live V2EX original zh-CN; D1 ready, Google chooser SSO and Azure translation configured.');
              passed=true;
              break;
            }catch(e){
              console.log('Production OAuth readiness attempt '+attempt+': '+String(e.message).replace(/[?#].*/,'').slice(0,125));
            }
            if(attempt<24)await new Promise(resolve=>setTimeout(resolve,12000));
          }
          if(!passed)throw Error('Gambling PROD OAuth flow not fully available after retries. Do not report user login as verified.');
          NODE

      - name: Record sanitized production language deployment evidence
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_RESULT: ${{ steps.live.outcome }}
          LIVE_RUN_ID: ${{ github.run_id }}
          LIVE_COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const repo='119shenhao/gambling',dest='docs/GAMBLING_PROD_LANGUAGE_LIVE_LATEST.json';
          const run=process.env.LIVE_RUN_ID||'';
          const status=process.env.LIVE_RESULT||'unknown';
          if(!/^[0-9]+$/.test(run)||!['success','failure','cancelled','skipped'].includes(status))
            throw Error('invalid_production_readiness_report');
          const report={
            run_id:Number(run),run_url:'https://github.com/'+repo+'/actions/runs/'+run,
            deployment_check:status,expected_worker_version:'0.5.1-language-proof-atomic.20261122',
            production_v2ex_original_language_expected:'zh-CN',
            source_commit:process.env.LIVE_COMMIT_SHA,
            checked_at:new Date().toISOString(),
            verified:status==='success'
          };
          const token=process.env.GITHUB_TOKEN;
          if(!token)throw Error('missing_ephemeral_github_token');
          const url='https://api.github.com/repos/'+repo+'/contents/'+dest;
          const headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
            'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
          const old=await fetch(url+'?ref=main',{headers});
          if(old.status!==404&&!old.ok)throw Error('unable_to_read_existing_production_status');
          const payload={branch:'main',message:'ops(report): persist live production original-language release validation',
            content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')};
          if(old.ok)payload.sha=(await old.json()).sha;
          const res=await fetch(url,{method:'PUT',headers,body:JSON.stringify(payload)});
          if(!res.ok)throw Error('unable_to_publish_live_release_evidence_http_'+res.status);
          console.log('Live production validation recorded:',status,'run',run);
          NODE
