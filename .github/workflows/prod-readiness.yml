name: Gambling production site and Worker Secret readiness (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-readiness.yml
      - wrangler.jsonc
      - src/auth.ts
      - src/index.ts
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect live PROD hostname and Worker runtime without mutation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const urls=['https://gambling.nbn369.com','https://gambling-community.119shenhao.workers.dev'];
          let checked=false;
          for(const origin of urls){
            try{
              const res=await fetch(origin+'/api/health',{redirect:'manual',signal:AbortSignal.timeout(13000)});
              const raw=await res.text();
              let h;try{h=JSON.parse(raw)}catch{console.log('Origin '+origin+' HTTP '+res.status+' non-JSON; unready');continue;}
              const s=h.translationSetup||{};
              console.log('Production host readiness '+JSON.stringify({
                origin,HTTP:res.status,env:h.environment,status:h.status,
                databaseConfigured:h.databaseConfigured,databaseReady:h.databaseReady,
                identityConfigured:h.identityConfigured,workerTranslationEnabled:s.workerEnabled,
                translatorSecretConfigured:s.keyConfigured,regionConfigured:s.regionConfigured
              }));
              if(res.ok&&h.environment==='production'&&h.databaseReady===true&&h.status==='ok'){
                checked=true;
                if(origin==='https://gambling.nbn369.com'){
                  if(h.identityConfigured!==false)throw Error('PROD login unexpectedly enabled before client activation');
                  if(s.workerEnabled===true)throw Error('PROD translation unexpectedly enabled');
                  console.log('PASS: exact production forum hostname is ready with D1; identity and translation gated.');
                  process.exit(0);
                }
              }
            }catch(e){console.log('Origin '+origin+' not currently serving required production health');}
          }
          if(!checked)throw Error('Production Worker or D1 cannot yet be verified from either hostname');
          throw Error('Production Worker available via workers.dev but custom gambling.nbn369.com hostname not confirmed');
          NODE
