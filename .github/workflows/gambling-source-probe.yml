name: Gambling source candidate probe (read only)
on:
  push:
    branches: [dev]
    paths: [.github/gambling-source-probe-request.json]
permissions:
  contents: read
concurrency:
  group: gambling-source-probe
  cancel-in-progress: false
jobs:
  public-web-structure-probe:
    if: github.repository == '119shenhao/gambling'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4==4.13.4'
      - name: Run forum parser contract tests
        run: python -m unittest discover -s tests -p 'test_gambling_*.py' -v
      - name: Probe metadata only, never capture or publish user content
        run: MSE_ONLY=1 python scripts/gambling_source_probe.py
      - name: Probe MSE actual paginated replies in memory (no import)
        run: python scripts/gambling_mse_live_probe.py
      - name: Diagnose MSE moderation versus public preview readback (read-only)
        run: python scripts/gambling_mse_visibility_diagnose.py
      - name: Probe Chinese source HTML structure without importing content
        run: python scripts/gambling_chinese_source_probe.py
      - name: Parse real V2EX 251-reply thread in memory (no import)
        run: python scripts/gambling_v2ex_live_probe.py
