name: Gambling production cache header diagnostics
on:
  push:
    branches: [qa/prod-translation-cdn-20261124]
    paths: [.github/workflows/gambling-r2-prod-acceptance.yml]
permissions:
  contents: read
jobs:
  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare public origin, edge, browser headers and repeated hits
        run: |
          node --input-type=module <<'NODE'
          const cdn='https://gambling-data.nbn369.com',origin='https://gambling.nbn369.com',id='74956015-0694-42ba-a3a7-a850f21b064b';
          const paths=['feeds/latest/page-1.json','topics/'+id+'/detail.json','i18n/zh-CN/topics/'+id+'/detail.json'];
          const fields=['cache-control','cdn-cache-control','cloudflare-cdn-cache-control','cf-cache-status','age','etag','last-modified','expires','vary','cf-ray','server','access-control-allow-origin'];
          async function read(key,withOrigin,method='GET'){
            const r=await fetch(cdn+'/'+key,{method,headers:withOrigin?{Origin:origin}:{},redirect:'error',signal:AbortSignal.timeout(10000)});
            const j=method==='GET'&&r.ok?await r.json():null;
            console.log(JSON.stringify({key,withOrigin,method,status:r.status,headers:Object.fromEntries(fields.map(k=>[k,r.headers.get(k)])),version:j?.contentVersion,invalidated:j?.invalidated||false,items:j?.items?.length}));
          }
          for(const key of paths){await read(key,true);await read(key,false);await read(key,true,'HEAD');}
          await new Promise(r=>setTimeout(r,5000));
          for(const key of paths)await read(key,true);
          NODE
